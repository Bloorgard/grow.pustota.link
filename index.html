<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grow.pustota.link — обрастание</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #161616;
  --ink: #f1ede5;
  --muted: rgba(241,237,229,.45);
  --faint: rgba(241,237,229,.12);
  --red: #e0210f;
  --bg: #161616;
  --fg: #f1ede5;
  --panel: rgba(241,237,229,.06);
  --border: rgba(241,237,229,.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: 'PT Mono', monospace; overflow: hidden; }
body { display: flex; flex-direction: column; touch-action: none; }
header {
  display: flex; align-items: center; gap: 0.8rem; padding: 0.5rem 0.9rem;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  flex-wrap: wrap; min-height: 0;
}
header .identity { font-weight: 500; font-size: 0.85rem; white-space: nowrap; }
header .identity a { color: var(--muted); text-decoration: none; }
header .identity a:hover { color: var(--fg); }
header .modes { display: flex; gap: 0.3rem; flex-wrap: wrap; }
header .modes button {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-family: inherit; font-size: 0.72rem; padding: 0.28rem 0.6rem;
  border-radius: 0.3rem; cursor: pointer; white-space: nowrap;
  transition: color .12s, border-color .12s, background .12s;
}
header .modes button:hover { color: var(--fg); border-color: rgba(241,237,229,.3); }
header .modes button.active { color: var(--fg); border-color: var(--fg); background: var(--panel); }
header .tools { display: flex; gap: 0.3rem; margin-left: auto; flex-wrap: wrap; }
header .tools button {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-family: inherit; font-size: 0.72rem; padding: 0.28rem 0.6rem;
  border-radius: 0.3rem; cursor: pointer; white-space: nowrap;
}
header .tools button:hover { color: var(--fg); }
main { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; min-height: 0; overflow: hidden; }
#canvas { display: block; cursor: crosshair; touch-action: none; }
.workspace-hint {
  position: absolute; bottom: 0.8rem; left: 50%; transform: translateX(-50%);
  color: rgba(241,237,229,0.6); font-size: 0.8rem; pointer-events: none; white-space: nowrap;
  z-index: 2;
}
.sketch-panel {
  position: absolute; top: 0.7rem; right: 0.7rem; z-index: 3;
  background: var(--panel); border: 1px solid var(--border); border-radius: 0.5rem;
  padding: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem;
  min-width: 200px; max-height: 85vh; overflow-y: auto; backdrop-filter: blur(8px);
}
.sketch-panel label { display: flex; flex-direction: column; gap: 0.2rem; }
.sketch-panel label span { font-size: 0.7rem; color: var(--muted); }
.sketch-panel input[type="range"] { width: 100%; accent-color: var(--fg); }
.sketch-panel button, .sketch-action {
  background: transparent; border: 1px solid var(--border); color: var(--fg);
  font-family: inherit; font-size: 0.72rem; padding: 0.3rem 0.5rem;
  border-radius: 0.3rem; cursor: pointer; text-align: left; width: 100%;
}
.sketch-panel button:hover, .sketch-action:hover { background: var(--panel); }
.sketch-panel hr { border: none; border-top: 1px solid var(--border); margin: 0.2rem 0; }
.section { margin-bottom: 0.1rem; }
.section-head {
  font-size: 0.62rem; color: rgba(241,237,229,0.4); text-transform: uppercase; letter-spacing: 0.08em;
  cursor: pointer; padding: 0.3rem 0; user-select: none;
  display: flex; justify-content: space-between; align-items: center;
}
.section-head::after { content: '▾'; font-size: 0.6rem; opacity: 0.5; }
.section.collapsed .section-head::after { content: '▸'; }
.section.collapsed .section-body { display: none; }
.section-body { display: flex; flex-direction: column; gap: 0.4rem; }
.tool-row { display: flex; gap: 0.3rem; }
.tool-row button { flex: 1; text-align: center; }
.tool-active { border-color: var(--fg); color: var(--fg); background: var(--panel); }
.tool-row button:not(.tool-active) { opacity: 0.4; }
.sketch-toggle {
  position: absolute; top: 0.7rem; right: 0.7rem; z-index: 2;
  background: var(--panel); border: 1px solid var(--border); color: var(--muted);
  font-family: inherit; font-size: 0.7rem; padding: 0.3rem 0.6rem;
  border-radius: 0.3rem; cursor: pointer; backdrop-filter: blur(8px);
}
.sketch-toggle:hover { color: var(--fg); }
footer {
  display: flex; justify-content: center; align-items: center; padding: 0.3rem;
  border-top: 1px solid var(--border); flex-shrink: 0;
  font-size: 0.65rem; color: var(--muted); gap: 0.8rem; flex-wrap: wrap;
}
footer #note { text-align: center; }
#svg-file { display: none; }
@media (max-width: 600px) {
  header { padding: 0.4rem; gap: 0.4rem; }
  header .identity { font-size: 0.75rem; }
  header .modes button, header .tools button { font-size: 0.65rem; padding: 0.2rem 0.4rem; }
  .sketch-panel { right: 0.4rem; top: 0.4rem; min-width: 160px; padding: 0.4rem; }
  .sketch-toggle { top: 0.4rem; right: 0.4rem; }
}
</style>
</head>
<body>

<header>
  <div class="identity">grow · <a href="https://pustota.link">pustota.link</a></div>
  <nav class="modes" id="modes">
    <button data-mode="walls" class="active">стены</button>
    <button data-mode="grow">рост</button>
  </nav>
  <div class="tools" id="tools"></div>
</header>

<main>
  <canvas id="canvas"></canvas>
  <div class="workspace-hint" id="hint">нарисуйте стены — потом «рост» обрастёт вокруг них</div>
  <div class="sketch-panel" id="panel" hidden></div>
  <button class="sketch-toggle" id="toggle">параметры (tab)</button>
</main>

<footer>
  <span id="note">grow · pustota.link</span>
</footer>

<input type="file" id="svg-file" accept=".svg,image/svg+xml">

<script type="module" src="app.js"></script>
</body>
</html>
