<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grow.pustota.link — обрастание</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #161616;
  --stage: #0b0b0a;
  --fg: #f1ede5;
  --muted: #aaa79f;
  --panel: #20201f;
  --border: #393936;
  --edge: #4d4d48;
  --red: #e0210f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: 'PT Mono', monospace; overflow: hidden; }
body { height: 100dvh; display: flex; flex-direction: column; }
button, input { font: inherit; }
button {
  min-height: 40px; padding: 0.55rem 0.75rem; border: 1px solid var(--border);
  border-radius: 5px; color: var(--fg); background: transparent; font-size: 0.75rem;
  cursor: pointer; transition: background .12s, border-color .12s;
}
button:hover:not(:disabled) { background: #2c2c29; border-color: #77756f; }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
button.active, .btn-active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button.active:hover:not(:disabled), .btn-active:hover:not(:disabled) { background: #d7d3cb; }

/* ===== шапка ===== */
header {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .75rem;
  padding: .35rem .75rem; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.identity { justify-self: start; font-size: .85rem; white-space: nowrap; color: var(--fg); text-decoration: none; }
.identity:hover { color: var(--muted); }
.modes { justify-self: center; display: flex; gap: .35rem; align-items: center; }
.header-actions { justify-self: end; display: flex; gap: .35rem; align-items: center; min-width: 0; }
.header-actions svg { width: 18px; height: 18px; flex-shrink: 0; }
.header-actions button, .export-menu summary { display: flex; align-items: center; justify-content: center; gap: .5rem; }
.export-menu { position: relative; }
.export-menu summary {
  min-height: 40px; padding: .55rem .75rem; border: 1px solid var(--border); border-radius: 5px;
  font-size: .75rem; cursor: pointer; list-style: none;
}
.export-menu summary::-webkit-details-marker { display: none; }
.export-menu summary:hover { background: #2c2c29; }
.export-options {
  position: absolute; top: calc(100% + .5rem); right: 0; z-index: 8; display: flex; gap: .4rem;
  padding: .5rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px #0005;
}

/* ===== сцена и холст ===== */
main { flex: 1; position: relative; display: flex; min-height: 0; overflow: hidden; }
.stage { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--stage); }
.sheet { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
#canvas {
  display: block; cursor: crosshair; touch-action: none; background: var(--bg);
  border: 1px solid var(--edge); box-shadow: 0 14px 44px #000a;
  transform-origin: center; transition: transform .2s ease;
}
#hint {
  position: absolute; left: 50%; bottom: 1.1rem; transform: translateX(-50%);
  max-width: min(90%, 420px); padding: .45rem .8rem; border-radius: 999px;
  background: #1d1d1caa; backdrop-filter: blur(3px); text-align: center; color: var(--muted);
  font-family: 'PT Sans', sans-serif; font-size: .85rem; line-height: 1.4; pointer-events: none;
}

/* ===== док под холстом ===== */
.dock {
  flex-shrink: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .3rem;
  padding: .45rem .75rem calc(.45rem + env(safe-area-inset-bottom));
  background: var(--bg); border-top: 1px solid var(--border);
}
.tool-group { display: flex; flex-wrap: wrap; justify-content: center; gap: .3rem; align-items: center; }
.dock-range { display: flex; align-items: center; gap: .4rem; padding: 0 .5rem; color: var(--muted); font-size: .7rem; white-space: nowrap; }
.dock-range input[type="range"] { width: 104px; min-height: 32px; accent-color: var(--fg); }
.dock-sep { width: 1px; align-self: stretch; margin: .2rem .25rem; background: var(--border); }

/* ===== сообщение ===== */
#message {
  position: absolute; top: .75rem; left: 50%; transform: translateX(-50%); z-index: 6;
  max-width: min(92%, 460px); padding: .6rem .9rem; border-radius: 6px;
  background: #322522; border: 1px solid #755046; font-size: .78rem; line-height: 1.4;
  box-shadow: 0 8px 24px #0006;
}

/* ===== панель ===== */
.sketch-panel {
  position: absolute; z-index: 5; top: 0; right: 0; bottom: 0; width: 300px;
  overflow-y: auto; overscroll-behavior: contain; padding: 1rem;
  background: var(--panel); border-left: 1px solid var(--border); box-shadow: -14px 0 40px #0006;
}
.panel-head { position: sticky; top: -1rem; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin: -1rem -1rem .6rem; padding: 1rem 1rem .6rem; background: var(--panel); }
.panel-head h2 { font-weight: 400; font-size: .9rem; }
.panel-head button { font-size: 1.1rem; min-width: 40px; }
.sketch-panel label { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .85rem; }
.sketch-panel label span, .pick-label { font-size: .75rem; color: var(--muted); }
.sketch-panel input[type="range"] { width: 100%; min-height: 32px; accent-color: var(--fg); }
.sketch-panel button { width: 100%; text-align: left; margin-bottom: .4rem; }
.sketch-panel .panel-head button, .sketch-panel .pick-row button { width: auto; margin: 0; }
.sketch-panel hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
.section { border-top: 1px solid var(--border); margin-top: .7rem; padding-top: .4rem; }
.sketch-panel .section-head { border: 0; padding: .65rem 0; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: .65rem; display: flex; justify-content: space-between; align-items: center; }
.section-head::after { content: '−'; font-size: 1rem; }
.section.collapsed .section-head::after { content: '+'; }
.section.collapsed .section-body { display: none; }
.pick-row { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .85rem; }
.pick-row button { flex: 1 1 calc(50% - .35rem); text-align: center; min-width: 0; }
.pick-label { width: 100%; margin: .3rem 0; }
.panel-note { font-family: 'PT Sans', sans-serif; color: var(--muted); font-size: .85rem; line-height: 1.45; margin: .5rem 0 1rem; }
.keys { font-size: .72rem; color: var(--muted); line-height: 1.9; }
.keys b { display: inline-block; min-width: 5.5rem; font-weight: 400; color: var(--fg); }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (max-width: 720px) {
  header { grid-template-columns: auto 1fr auto; padding: .25rem .5rem; gap: .5rem; }
  .identity { font-size: .75rem; }
  button { min-height: 44px; padding: .55rem .65rem; }
  .header-actions { gap: .25rem; }
  .header-actions .action-label { display: none; }
  .header-actions button, .export-menu summary { min-height: 44px; min-width: 44px; padding: .5rem; }
  .dock-range { padding: 0 .25rem; }
  .dock-range .range-label { display: none; }
  .dock-range input[type="range"] { width: 84px; }
  .sketch-panel { top: auto; left: 0; width: auto; max-height: 62%; border-left: 0; border-top: 1px solid var(--border); box-shadow: 0 -14px 40px #0007; }
}
</style>
</head>
<body>

<header>
  <a class="identity" href="https://pustota.link" title="pustota.link">grow</a>
  <nav class="modes" id="modes" aria-label="Режим работы">
    <button data-mode="walls" class="active" aria-pressed="true">стены</button>
    <button data-mode="grow" aria-pressed="false" title="Сначала нарисуйте стены">рост</button>
  </nav>
  <div class="header-actions">
    <button id="toggle" aria-label="Настройки" title="Настройки" aria-controls="panel" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h5m4 0h7M4 17h9m4 0h3"/><circle cx="11" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg>
      <span class="action-label">настройки</span>
    </button>
    <details class="export-menu" id="export-menu">
      <summary aria-label="Сохранить рисунок" title="Сохранить рисунок">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></svg>
        <span class="action-label">сохранить</span>
      </summary>
      <div class="export-options">
        <button id="export-png" aria-label="Сохранить PNG">PNG</button>
        <button id="export-svg" aria-label="Сохранить SVG">SVG</button>
      </div>
    </details>
  </div>
</header>

<main>
  <div class="stage" id="stage">
    <div class="sheet" id="sheet">
      <canvas id="canvas" aria-label="Холст для рисования стен и выращивания узора"></canvas>
      <span id="hint">нарисуйте стены — затем включите рост</span>
    </div>
    <div class="dock" id="dock" aria-label="Инструменты">
      <div class="tool-group" id="wall-tools">
        <button id="brush" class="btn-active" aria-pressed="true">кисть</button>
        <button id="eraser" aria-pressed="false">ластик</button>
        <label class="dock-range" title="Размер кисти (колесо мыши)">
          <span class="range-label" id="brush-size-label">размер · 6</span>
          <input type="range" id="brush-size" min="2" max="26" step="1" value="6" aria-label="Размер кисти">
        </label>
        <span class="dock-sep" aria-hidden="true"></span>
        <button id="undo" title="Отменить (⌘/Ctrl+Z)" disabled>отменить</button>
        <button id="import" title="Загрузить SVG">SVG +</button>
      </div>
      <div class="tool-group" id="grow-tools" hidden>
        <button id="pause" aria-pressed="false" title="Пробел">пауза</button>
        <button id="restart" title="Заново (R)">заново</button>
      </div>
      <div class="tool-group" id="svg-tools" hidden>
        <button id="svg-apply" class="btn-active">применить SVG</button>
        <button id="svg-cancel">отменить SVG</button>
        <label class="dock-range" title="Масштаб SVG (колесо мыши)">
          <span class="range-label" id="svg-scale-label">масштаб · 100%</span>
          <input type="range" id="svg-scale" min="10" max="500" step="1" value="100" aria-label="Масштаб SVG">
        </label>
      </div>
    </div>
    <div id="message" role="alert" hidden></div>
  </div>
  <aside class="sketch-panel" id="panel" aria-label="Настройки" hidden></aside>
</main>

<span id="note" class="sr-only" role="status"></span>
<input type="file" id="svg-file" hidden accept=".svg,image/svg+xml">

<script type="module" src="app.js"></script>
</body>
</html>
